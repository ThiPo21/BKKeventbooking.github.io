{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-3 sm:px-6 py-10 sm:py-16">
    <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-sky-100">
        <div class="text-center mb-6 sm:mb-8">
            <span class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-sky-100 text-cheero-500 flex items-center justify-center text-xl sm:text-2xl mx-auto mb-2.5 sm:mb-3 shadow-xs">
                🔐
            </span>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800">เข้าสู่ระบบ</h2>
            <p class="text-xs text-slate-400 mt-1">ยินดีต้อนรับกลับสู่ระบบจองอีเว้นท์บาสเกตบอล</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">ชื่อผู้ใช้ (Username):</label>
                <input type="text" name="username" required 
                       class="w-full px-4 py-3 border border-sky-200 rounded-2xl focus:ring-2 focus:ring-cheero-400 text-xs sm:text-sm outline-none transition bg-sky-50/20"
                       placeholder="กรอกชื่อผู้ใช้ของคุณ">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">รหัสผ่าน (Password):</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 border border-sky-200 rounded-2xl focus:ring-2 focus:ring-cheero-400 text-xs sm:text-sm outline-none transition bg-sky-50/20"
                       placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-cheero-500 hover:bg-cheero-600 text-white font-bold py-3.5 rounded-2xl transition shadow-xs shadow-cheero-200 text-xs sm:text-sm mt-2">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-sky-50 text-center text-xs text-slate-500">
            ยังไม่มีบัญชีใช่หรือไม่? 
            <a href="/register" class="text-cheero-500 font-bold hover:underline">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}
